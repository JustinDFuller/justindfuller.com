---
name: Build and Deploy to Cloudflare
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.x"
          cache: npm
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: go test ./...
      - run: node --test scripts/grass.test.mjs
      - run: npm run build:cloudflare
      - run: npx cf deploy --prebuilt --mode staging --dry-run
      - name: Record artifact checksum
        run: |
          tar -cf cloudflare-artifact.tar dist .cloudflare/output .cloudflare/site-manifest.json
          sha256sum cloudflare-artifact.tar | tee cloudflare-artifact.sha256
          printf 'Commit: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat cloudflare-artifact.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: cloudflare-${{ github.sha }}
          path: |
            cloudflare-artifact.tar
            cloudflare-artifact.sha256
          retention-days: 14
      - name: Deploy tested artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx cf deploy --prebuilt --mode staging --message "$GITHUB_SHA" > cloudflare-deployment.log 2>&1
          cat cloudflare-deployment.log
          node scripts/record-cloudflare-deployment.mjs
      - name: Verify deployed site
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: node scripts/verify-cloudflare.mjs "$(cat .cloudflare/deployed-url.txt)"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: cloudflare-deployment-${{ github.sha }}
          path: .cloudflare/deployment.json
