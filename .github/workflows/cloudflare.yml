name: Build and Deploy to Cloudflare
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_kind:
        description: Publication request kind
        type: choice
        options: [site, content, preview]
        default: site
      source_revision:
        description: Informational uploaded source revision
        type: string
        required: false
      preview_pr:
        description: Open same-repository PR number for preview refresh
        type: string
        required: false
      bootstrap:
        description: Explicitly initialize a target using its verified prior receipt
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read
jobs:
  admission:
    if: github.event_name != 'pull_request_target' || vars.OBSIDIAN_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      targets: ${{ steps.plan.outputs.targets }}
      validation_only: ${{ steps.plan.outputs.validation_only }}
      preview_pr: ${{ steps.plan.outputs.preview_pr }}
      preview_sha: ${{ steps.plan.outputs.preview_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        if: github.event_name != 'pull_request_target'
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        if: github.event_name == 'pull_request_target'
        with:
          ref: refs/heads/main
          path: control
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.x"
      - name: Validate publication request
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) && github.token || '' }}
        run: node ${{ github.event_name == 'pull_request_target' && 'control/scripts/plan-obsidian-workflow.mjs' || 'scripts/plan-obsidian-workflow.mjs' }}
      - name: Preserve legacy request guard while private publishing is disabled
        if: vars.OBSIDIAN_PUBLISH_ENABLED != 'true'
        env:
          GITHUB_TOKEN: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) && github.token || '' }}
        run: node ${{ github.event_name == 'pull_request_target' && 'control/scripts/plan-obsidian-workflow.mjs' || 'scripts/plan-obsidian-workflow.mjs' }} --legacy-guard
  site:
    needs: admission
    if: github.event_name == 'pull_request' || (vars.OBSIDIAN_PUBLISH_ENABLED != 'true' && needs.admission.outputs.kind == 'site')
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('cloudflare-refs/pull/{0}/merge', github.event.number) || 'cloudflare-production' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_MODE: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/heads/main
          path: control
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.x"
          cache: npm
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm ci --prefix tools/obsidian-image-publisher
      - run: go test ./...
      - run: node --test scripts/*.test.mjs tools/obsidian-image-publisher/tests/*.test.ts
      - run: tools/obsidian-image-publisher/node_modules/.bin/tsc -p tools/obsidian-image-publisher --noEmit
      - run: npm run build:cloudflare -- --mode "$BUILD_MODE"
      - name: Validate deployment configuration
        if: env.BUILD_MODE == 'production'
        run: npx cf deploy --prebuilt --mode production --dry-run
      - name: Record artifact checksum
        run: |
          tar -cf cloudflare-artifact.tar dist .cloudflare/output .cloudflare/site-manifest.json
          sha256sum cloudflare-artifact.tar | tee cloudflare-artifact.sha256
          printf 'Commit: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat cloudflare-artifact.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: cloudflare-${{ github.sha }}
          path: |
            cloudflare-artifact.tar
            cloudflare-artifact.sha256
          retention-days: 14
      - name: Deploy tested production artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx cf deploy --prebuilt --mode production --message "$GITHUB_SHA" > cloudflare-deployment.log 2>&1
          cat cloudflare-deployment.log
          node scripts/record-cloudflare-deployment.mjs --mode production
      - name: Verify production hostnames
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          node scripts/verify-cloudflare.mjs https://justindfuller.com --mode production
          node scripts/verify-cloudflare.mjs https://www.justindfuller.com --mode production
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: cloudflare-deployment-${{ github.sha }}
          path: .cloudflare/deployment.json
  preview:
    if: needs.admission.outputs.validation_only != 'true' && vars.OBSIDIAN_PUBLISH_ENABLED != 'true' && vars.OBSIDIAN_PREVIEW_ACCESS_ENABLED != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    needs: [admission, site]
    concurrency:
      group: ${{ format('cloudflare-refs/pull/{0}/merge', github.event.number) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/heads/main
          path: control
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: cloudflare-${{ github.sha }}
      - name: Restore tested artifact
        run: |
          sha256sum -c cloudflare-artifact.sha256
          tar -xf cloudflare-artifact.tar
      - name: Deploy tested PR preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          npx cf previews deploy "$PREVIEW_NAME" --prebuilt --mode preview > cloudflare-deployment.log
          cat cloudflare-deployment.log
          node scripts/record-cloudflare-deployment.mjs --mode preview
      - name: Verify exact preview deployment
        run: node scripts/verify-cloudflare.mjs "$(cat .cloudflare/deployed-url.txt)" --mode preview
      - uses: actions/upload-artifact@v7
        with:
          name: cloudflare-deployment-${{ github.sha }}
          path: .cloudflare/deployment.json
      - name: Update preview comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const record = JSON.parse(fs.readFileSync('.cloudflare/deployment.json', 'utf8'));
            const issue_number = context.payload.pull_request.number;
            const params = { ...context.repo, issue_number };
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const existing = comments.find(comment => comment.user.login === 'github-actions[bot]' && (comment.body.includes('<!-- cloudflare-preview -->') || comment.body.includes('🚀 Preview Environment Deployed')));
            const body = `<!-- cloudflare-preview -->\nCloudflare preview: ${record.previewUrl}\n\nTested deployment: ${record.url}\n\nCommit: \`${context.payload.pull_request.head.sha}\` (tested merge: \`${record.commit}\`).\n\nThis preview updates with the PR and is deleted when the PR closes.`;
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...params, body });
  production:
    needs: admission
    if: vars.OBSIDIAN_PUBLISH_ENABLED == 'true' && needs.admission.outputs.validation_only != 'true' && needs.admission.outputs.kind != 'preview'
    uses: ./.github/workflows/obsidian-target.yml
    with:
      mode: production
      kind: ${{ needs.admission.outputs.kind }}
      bootstrap: ${{ github.event.inputs.bootstrap == 'true' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OBSIDIAN_STATE_ACCESS_KEY_ID: ${{ secrets.OBSIDIAN_STATE_ACCESS_KEY_ID }}
      OBSIDIAN_STATE_SECRET_ACCESS_KEY: ${{ secrets.OBSIDIAN_STATE_SECRET_ACCESS_KEY }}
      OBSIDIAN_SOURCE_ACCESS_KEY_ID: ${{ secrets.OBSIDIAN_SOURCE_ACCESS_KEY_ID }}
      OBSIDIAN_SOURCE_SECRET_ACCESS_KEY: ${{ secrets.OBSIDIAN_SOURCE_SECRET_ACCESS_KEY }}
      OBSIDIAN_MEDIA_ACCESS_KEY_ID: ${{ secrets.OBSIDIAN_MEDIA_ACCESS_KEY_ID }}
      OBSIDIAN_MEDIA_SECRET_ACCESS_KEY: ${{ secrets.OBSIDIAN_MEDIA_SECRET_ACCESS_KEY }}
      OBSIDIAN_BOOTSTRAP_RECEIPT_PRODUCTION_JSON: ${{ secrets.OBSIDIAN_BOOTSTRAP_RECEIPT_PRODUCTION_JSON }}
  staging:
    needs: admission
    if: vars.OBSIDIAN_PUBLISH_ENABLED == 'true' && needs.admission.outputs.validation_only != 'true' && needs.admission.outputs.kind != 'preview'
    uses: ./.github/workflows/obsidian-target.yml
    with:
      mode: staging
      kind: ${{ needs.admission.outputs.kind }}
      bootstrap: ${{ github.event.inputs.bootstrap == 'true' }}
    secrets:
      OBSIDIAN_STATE_ACCESS_KEY_ID: ${{ secrets.OBSIDIAN_STATE_ACCESS_KEY_ID }}
      OBSIDIAN_STATE_SECRET_ACCESS_KEY: ${{ secrets.OBSIDIAN_STATE_SECRET_ACCESS_KEY }}
      OBSIDIAN_SOURCE_ACCESS_KEY_ID: ${{ secrets.OBSIDIAN_SOURCE_ACCESS_KEY_ID }}
      OBSIDIAN_SOURCE_SECRET_ACCESS_KEY: ${{ secrets.OBSIDIAN_SOURCE_SECRET_ACCESS_KEY }}
      CLOUDFLARE_STAGING_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      CF_ACCESS_STAGING_CLIENT_ID: ${{ secrets.CF_ACCESS_STAGING_CLIENT_ID }}
      CF_ACCESS_STAGING_CLIENT_SECRET: ${{ secrets.CF_ACCESS_STAGING_CLIENT_SECRET }}
      OBSIDIAN_ACCESS_STAGING_JSON: ${{ secrets.OBSIDIAN_ACCESS_STAGING_JSON }}
      OBSIDIAN_BOOTSTRAP_RECEIPT_STAGING_JSON: ${{ secrets.OBSIDIAN_BOOTSTRAP_RECEIPT_STAGING_JSON }}
  private-preview:
    needs: admission
    if: (github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch') && vars.OBSIDIAN_PUBLISH_ENABLED == 'true' && needs.admission.outputs.validation_only != 'true' && needs.admission.outputs.kind == 'preview'
    uses: ./.github/workflows/obsidian-target.yml
    with:
      mode: preview
      kind: preview
      pr: ${{ needs.admission.outputs.preview_pr }}
      expected_code_sha: ${{ needs.admission.outputs.preview_sha }}
      bootstrap: ${{ github.event.inputs.bootstrap == 'true' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OBSIDIAN_STATE_ACCESS_KEY_ID: ${{ secrets.OBSIDIAN_STATE_ACCESS_KEY_ID }}
      OBSIDIAN_STATE_SECRET_ACCESS_KEY: ${{ secrets.OBSIDIAN_STATE_SECRET_ACCESS_KEY }}
      OBSIDIAN_SOURCE_ACCESS_KEY_ID: ${{ secrets.OBSIDIAN_SOURCE_ACCESS_KEY_ID }}
      OBSIDIAN_SOURCE_SECRET_ACCESS_KEY: ${{ secrets.OBSIDIAN_SOURCE_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      CF_ACCESS_PREVIEW_CLIENT_ID: ${{ secrets.CF_ACCESS_PREVIEW_CLIENT_ID }}
      CF_ACCESS_PREVIEW_CLIENT_SECRET: ${{ secrets.CF_ACCESS_PREVIEW_CLIENT_SECRET }}
      OBSIDIAN_ACCESS_PREVIEW_JSON: ${{ secrets.OBSIDIAN_ACCESS_PREVIEW_JSON }}
      OBSIDIAN_BOOTSTRAP_RECEIPT_PREVIEW_JSON: ${{ secrets.OBSIDIAN_BOOTSTRAP_RECEIPT_PREVIEW_JSON }}
