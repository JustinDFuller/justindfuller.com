---
name: Cleanup Cloudflare PR Preview
on:
  pull_request:
    types: [closed]
permissions:
  contents: read
concurrency:
  group: cloudflare-refs/pull/${{ github.event.pull_request.number }}/merge
  cancel-in-progress: false
jobs:
  cleanup-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.x"
      - name: Delete PR preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: node scripts/delete-cloudflare-preview.mjs --name "$PREVIEW_NAME"
